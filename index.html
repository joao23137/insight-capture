<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e13" />
<title>Cérebro — Captura</title>
<link rel="manifest" href="manifest.json" />
<style>
  :root{
    --txt:#e8eef5; --mut:#8b98a9; --field:#0e141b; --line:#232c38;
    --em1:#34d399; --em2:#10b981; --em3:#059669;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; }
  body{
    min-height:100dvh; color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;
    background:#05070a;
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom));
  }
  /* fundo topográfico animado (WebGL) */
  #bg{ position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block; }
  .glow{ position:fixed; inset:0; z-index:1; pointer-events:none; background:
      radial-gradient(1100px 560px at 50% -12%, rgba(52,211,153,.14), transparent 60%),
      radial-gradient(760px 520px at 50% 115%, rgba(99,102,241,.09), transparent 60%),
      radial-gradient(circle at 50% 45%, transparent 30%, rgba(0,0,0,.6) 100%); }
  .wrap{
    width:100%; max-width:452px; position:relative; z-index:2;
    background:rgba(18,24,33,.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.08); border-radius:24px;
    padding:24px 22px 20px; box-shadow:0 24px 70px rgba(0,0,0,.5);
    animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(16px) scale(.98);} to{ opacity:1; transform:none;} }

  .head{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .badge{ width:46px; height:46px; border-radius:14px; flex:none; display:grid; place-items:center;
    font-size:25px; background:linear-gradient(135deg,var(--em1),var(--em3));
    box-shadow:0 8px 22px rgba(16,185,129,.4); transition:transform .2s; }
  .badge.pulse{ animation:pop .5s cubic-bezier(.2,1.4,.4,1); }
  .head .t h1{ font-size:17px; margin:0; font-weight:700; letter-spacing:.2px; }
  .head .t p{ margin:3px 0 0; font-size:12.5px; color:var(--mut); }
  #net{ margin-left:auto; font-size:11px; color:var(--mut); border:1px solid var(--line);
    padding:4px 9px; border-radius:999px; white-space:nowrap; align-self:flex-start; }

  .counter{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--em1);
    background:rgba(16,185,129,.10); border:1px solid rgba(16,185,129,.25);
    padding:5px 11px; border-radius:999px; margin-bottom:16px; transition:transform .2s; }
  .counter.bump{ animation:pop .45s cubic-bezier(.2,1.4,.4,1); }

  textarea{ width:100%; min-height:120px; max-height:340px; resize:none; overflow-y:auto;
    background:var(--field); color:var(--txt); border:1px solid var(--line); border-radius:15px;
    padding:15px; font-size:16px; line-height:1.55; outline:none; font-family:inherit;
    transition:border-color .15s, box-shadow .15s; }
  textarea::placeholder{ color:#5b6675; }
  textarea:focus{ border-color:var(--em2); box-shadow:0 0 0 3px rgba(52,211,153,.15); }
  .meta{ display:flex; justify-content:space-between; align-items:center; margin:8px 2px 0; font-size:11.5px; color:#57616f; }
  .kbd{ opacity:.7; }

  .tags{ display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 18px; }
  .tag{ padding:8px 13px; border-radius:999px; border:1px solid var(--line); background:var(--field);
    color:var(--mut); font-size:13.5px; cursor:pointer; user-select:none;
    transition:transform .12s, background .15s, color .15s, border-color .15s, box-shadow .15s; }
  .tag:hover{ border-color:#3a4757; color:var(--txt); }
  .tag:active{ transform:scale(.94); }
  .tag.on{ background:linear-gradient(135deg,var(--em1),var(--em3)); border-color:transparent;
    color:#03130c; font-weight:600; box-shadow:0 4px 13px rgba(16,185,129,.32); animation:pop .35s cubic-bezier(.2,1.4,.4,1); }

  button.save{ position:relative; width:100%; padding:15px; font-size:16px; font-weight:700; border:none;
    border-radius:14px; cursor:pointer; color:#03130c; background:linear-gradient(135deg,var(--em1),var(--em2));
    box-shadow:0 8px 22px rgba(16,185,129,.38); letter-spacing:.2px; overflow:hidden;
    transition:transform .1s, box-shadow .15s, opacity .15s; }
  button.save:hover{ box-shadow:0 11px 28px rgba(16,185,129,.48); }
  button.save:active{ transform:translateY(1px) scale(.995); }
  button.save:disabled{ opacity:.5; box-shadow:none; cursor:default; }
  .spinner{ width:17px; height:17px; border:2.5px solid rgba(3,19,12,.35); border-top-color:#03130c;
    border-radius:50%; display:inline-block; vertical-align:-3px; animation:spin .6s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .status{ margin-top:13px; font-size:13.5px; min-height:18px; text-align:center; }
  .ok{ color:var(--em1);} .err{ color:#f87171;} .warn{ color:#fbbf24;}
  .hint{ margin-top:14px; text-align:center; font-size:11.5px; color:#57616f; }

  .recent{ margin-top:22px; }
  .recent h2, .queue h2{ font-size:11px; color:var(--mut); font-weight:600; margin:0 0 8px;
    text-transform:uppercase; letter-spacing:.6px; }
  .ritem{ background:var(--field); border:1px solid var(--line); border-left:3px solid var(--em2);
    border-radius:11px; padding:10px 12px; margin-bottom:7px; font-size:13px; color:var(--txt);
    animation:slideIn .28s ease both; }
  .ritem .rtags{ margin-top:5px; font-size:11px; color:var(--em1); }
  .ritem .rtime{ float:right; font-size:11px; color:var(--mut); }
  @keyframes slideIn{ from{ opacity:0; transform:translateY(-8px);} to{ opacity:1; transform:none;} }

  .queue{ margin-top:22px; font-size:13px; color:var(--mut); }
  .qitem{ background:var(--field); border:1px solid var(--line); border-radius:11px; padding:10px 12px;
    margin-bottom:6px; font-size:13px; display:flex; justify-content:space-between; gap:8px; }
  .qitem small{ color:var(--mut); white-space:nowrap; }

  .cfg{ margin-top:22px; border-top:1px solid rgba(255,255,255,.06); padding-top:14px; }
  .cfg summary{ color:var(--mut); font-size:12.5px; cursor:pointer; list-style:none; }
  .cfg summary::-webkit-details-marker{ display:none; }
  .cfg input{ width:100%; margin-top:6px; background:var(--field); color:var(--txt); border:1px solid var(--line);
    border-radius:10px; padding:10px; font-size:13.5px; outline:none; }
  .cfg input:focus{ border-color:var(--em2); }
  .cfg label{ font-size:11.5px; color:var(--mut); display:block; margin-top:12px; }

  @keyframes pop{ 0%{ transform:scale(1);} 40%{ transform:scale(1.12);} 100%{ transform:scale(1);} }

  /* checkmark de sucesso */
  .splash{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; pointer-events:none; z-index:50; }
  .splash.show{ display:flex; }
  .splash .ring{ width:120px; height:120px; border-radius:50%; display:grid; place-items:center; font-size:60px;
    color:#03130c; background:linear-gradient(135deg,var(--em1),var(--em3));
    box-shadow:0 20px 60px rgba(16,185,129,.6); animation:splashPop .7s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes splashPop{ 0%{ opacity:0; transform:scale(.4);} 30%{ opacity:1; transform:scale(1.05);}
    70%{ opacity:1; transform:scale(1);} 100%{ opacity:0; transform:scale(1);} }

  /* abas */
  .tabs{ display:flex; gap:6px; background:var(--field); border:1px solid var(--line); border-radius:13px; padding:4px; margin-bottom:16px; }
  .tab-btn{ flex:1; text-align:center; padding:9px; border-radius:10px; font-size:13.5px; color:var(--mut);
    cursor:pointer; user-select:none; transition:all .15s; border:none; background:transparent; font-family:inherit; }
  .tab-btn.on{ background:linear-gradient(135deg,var(--em1),var(--em3)); color:#03130c; font-weight:700; }
  /* análises */
  #anList{ display:flex; flex-direction:column; gap:14px; }
  .an{ background:var(--field); border:1px solid var(--line); border-radius:14px; padding:14px 15px; animation:slideIn .28s ease both; }
  .an .an-date{ font-size:11px; color:var(--mut); margin-bottom:4px; }
  .an h1.md{ font-size:16px; margin:0 0 .3em; font-weight:700; }
  .an h3{ font-size:13.5px; margin:.7em 0 .3em; color:var(--em1); font-weight:700; }
  .an p{ font-size:13px; color:var(--txt); margin:.4em 0; line-height:1.5; }
  .an blockquote{ margin:.5em 0; padding:8px 12px; border-left:3px solid var(--em2); background:rgba(16,185,129,.06); border-radius:8px; font-size:12px; color:var(--mut); }
  .an ul{ margin:.4em 0; padding-left:18px; } .an li{ font-size:13px; margin:2px 0; }
  /* KPIs (resumo em cartões) */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:10px; margin:.7em 0; }
  .kpi{ background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:12px; padding:12px 13px; }
  .kpi-l{ font-size:10px; color:var(--mut); margin-bottom:5px; text-transform:uppercase; letter-spacing:.4px; }
  .kpi-v{ font-size:19px; font-weight:800; color:var(--txt); line-height:1.1; }
  .kpi-v.pos{ color:var(--em1); } .kpi-v.neg{ color:#f87171; }
  /* tabelas (rolagem lateral suave + coluna fixa + zebra + cores) */
  .an .tbl-wrap{ overflow-x:auto; margin:.6em 0; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:12px; }
  .an table{ border-collapse:collapse; width:100%; font-size:12px; }
  .an th, .an td{ padding:8px 10px; text-align:left; white-space:nowrap; border-bottom:1px solid var(--line); }
  .an th{ background:#131a24; color:var(--mut); font-weight:600; }
  .an tbody tr:nth-child(even) td{ background:rgba(255,255,255,.02); }
  .an th:first-child, .an td:first-child{ position:sticky; left:0; z-index:1; background:var(--field); border-right:1px solid var(--line); }
  .an tbody tr:nth-child(even) td:first-child{ background:var(--field); }
  .an thead th:first-child{ background:#131a24; z-index:2; }
  .an td.pos{ color:var(--em1); font-weight:600; } .an td.neg{ color:#f87171; font-weight:600; }
  .an td:last-child{ font-weight:700; }
  /* mini-abas dentro da análise */
  .subtabs{ display:flex; gap:6px; overflow-x:auto; margin:.8em 0 .5em; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
  .subtab{ flex:0 0 auto; padding:6px 13px; border-radius:999px; border:1px solid var(--line); background:var(--field);
    color:var(--mut); font-size:12px; cursor:pointer; white-space:nowrap; font-family:inherit; transition:all .15s; }
  .subtab.on{ background:rgba(16,185,129,.15); border-color:var(--em2); color:var(--em1); font-weight:700; }
  .subpanel[hidden]{ display:none; }
  /* cartões de ranking (substituem as tabelas largas) */
  .cards{ display:flex; flex-direction:column; gap:8px; margin:.6em 0; }
  .card{ background:var(--field); border:1px solid var(--line); border-radius:12px; padding:11px 12px; }
  .card-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .card-name{ font-size:13px; font-weight:600; color:var(--txt); line-height:1.3; }
  .card-h{ font-size:15px; font-weight:800; white-space:nowrap; color:var(--em1); }
  .card-h.neg{ color:#f87171; }
  .bar{ height:5px; background:rgba(255,255,255,.06); border-radius:3px; margin:8px 0; overflow:hidden; }
  .bar i{ display:block; height:100%; border-radius:3px; background:linear-gradient(90deg,var(--em3),var(--em1)); }
  .bar i.neg{ background:linear-gradient(90deg,#b91c1c,#f87171); }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ font-size:11px; color:var(--txt); background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:7px; padding:3px 7px; white-space:nowrap; }
  .chip-l{ color:var(--mut); }
  .an-empty, .an-loading{ text-align:center; color:var(--mut); font-size:13px; padding:24px 0; line-height:1.6; }

  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="glow"></div>
<div class="wrap" id="card">
  <div class="head">
    <div class="badge" id="badge">🧠</div>
    <div class="t">
      <h1>Captura de Insight</h1>
      <p>Joga aqui, o cérebro organiza.</p>
    </div>
    <span id="net">•</span>
  </div>

  <div class="tabs">
    <button class="tab-btn on" id="tabCap">✍️ Capturar</button>
    <button class="tab-btn" id="tabAn">📊 Análises</button>
  </div>

  <section id="capV">
  <div class="counter" id="counter">🔥 <span id="cnum">0</span> insights hoje</div>

  <textarea id="txt" placeholder="Qual insight passou pela sua cabeça agora?"></textarea>
  <div class="meta">
    <span id="count">0 palavras</span>
    <span class="kbd">Ctrl + Enter pra salvar</span>
  </div>

  <div class="tags" id="tags">
    <span class="tag" data-tag="ideia">💡 ideia</span>
    <span class="tag" data-tag="campanha">📈 campanha</span>
    <span class="tag" data-tag="pesquisa">🔎 pesquisa</span>
    <span class="tag" data-tag="analise">📊 análise</span>
    <span class="tag" data-tag="pessoal">🙂 pessoal</span>
    <span class="tag" data-tag="tarefa">✅ tarefa</span>
  </div>

  <button class="save" id="save"><span id="savelbl">Salvar no cérebro</span></button>
  <div class="status" id="status"></div>
  <div class="hint">Aparece em minutos direto no seu Obsidian 🧠</div>

  <div class="recent" id="recentBox" style="display:none">
    <h2>Capturados agora</h2>
    <div id="recent"></div>
  </div>

  <div class="queue" id="queueBox" style="display:none">
    <h2>Aguardando envio (offline)</h2>
    <div id="queue"></div>
  </div>
  </section>

  <section id="anV" hidden>
    <div id="anList"><div class="an-loading">Carregando…</div></div>
  </section>

  <details class="cfg">
    <summary>⚙️ Configuração avançada</summary>
    <label>Supabase URL</label>
    <input id="cfgUrl" placeholder="https://xxxx.supabase.co" />
    <label>Supabase anon key</label>
    <input id="cfgKey" placeholder="eyJ..." />
    <label>Sua senha de captura (a mesma do puxador)</label>
    <input id="cfgSecret" placeholder="uma frase secreta sua" />
  </details>
</div>

<div class="splash" id="splash"><div class="ring">✓</div></div>

<script>
const $ = (id) => document.getElementById(id);
const LS = { url:"ic_url", key:"ic_key", secret:"ic_secret", queue:"ic_queue" };
let activeTags = new Set();
const recent = [];

const DEFAULTS = {
  url: "https://mjexkhdcsacabhahigsu.supabase.co",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qZXhraGRjc2FjYWJoYWhpZ3N1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3ODg0NDIsImV4cCI6MjEwMzM2NDQ0Mn0.MiHFDeEiyN0w1KI0AlIyhRCJxhRuuashI6Q9bjka564",
  secret: "daudt-cerebro-2026",
};
if (!localStorage.getItem(LS.url))    localStorage.setItem(LS.url, DEFAULTS.url);
if (!localStorage.getItem(LS.key))    localStorage.setItem(LS.key, DEFAULTS.key);
if (!localStorage.getItem(LS.secret)) localStorage.setItem(LS.secret, DEFAULTS.secret);

$("cfgUrl").value = localStorage.getItem(LS.url) || "";
$("cfgKey").value = localStorage.getItem(LS.key) || "";
$("cfgSecret").value = localStorage.getItem(LS.secret) || "";
["cfgUrl","cfgKey","cfgSecret"].forEach((id,i)=>{
  const k=[LS.url,LS.key,LS.secret][i];
  $(id).addEventListener("input",()=>localStorage.setItem(k,$(id).value.trim()));
});

const buzz = (ms) => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

function todayKey(){ const d=new Date(),p=(n)=>String(n).padStart(2,"0"); return "ic_day_"+d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function getDay(){ return parseInt(localStorage.getItem(todayKey())||"0",10); }
function bumpDay(){ const n=getDay()+1; localStorage.setItem(todayKey(),String(n)); renderDay(true); }
function renderDay(anim){ $("cnum").textContent=getDay(); if(anim){ const c=$("counter"); c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); } }

// textarea: auto-crescer + contador de palavras
const txt = $("txt");
function autogrow(){ txt.style.height="auto"; txt.style.height=Math.min(txt.scrollHeight,340)+"px"; }
function countWords(){ const w=txt.value.trim(); const n=w?w.split(/\s+/).length:0; $("count").textContent=n+(n===1?" palavra":" palavras"); }
txt.addEventListener("input",()=>{ autogrow(); countWords(); });
txt.addEventListener("keydown",(e)=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); $("save").click(); } });

// Tags
$("tags").addEventListener("click",(e)=>{
  const t=e.target.closest(".tag"); if(!t)return;
  const tag=t.dataset.tag; buzz(12);
  if(activeTags.has(tag)){activeTags.delete(tag);t.classList.remove("on");}
  else{activeTags.add(tag);t.classList.remove("on"); void t.offsetWidth; t.classList.add("on");}
});

// Rede
function updateNet(){ $("net").textContent = navigator.onLine ? "🟢 online" : "🔴 offline"; }
window.addEventListener("online",()=>{updateNet();flushQueue();});
window.addEventListener("offline",updateNet); updateNet();

// Fila offline
function getQueue(){ try{return JSON.parse(localStorage.getItem(LS.queue)||"[]");}catch{return[];} }
function setQueue(q){ localStorage.setItem(LS.queue,JSON.stringify(q)); renderQueue(); }
function renderQueue(){
  const q=getQueue(), box=$("queueBox");
  if(!q.length){box.style.display="none";return;}
  box.style.display="block";
  $("queue").innerHTML=q.map(it=>`<div class="qitem"><span>${esc((it.texto||"").slice(0,60))}…</span><small>${(it.criado_em||"").slice(11,16)}</small></div>`).join("");
}

// Lista "capturados agora"
function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function addRecent(item){
  recent.unshift(item);
  const box=$("recentBox"); box.style.display="block";
  $("recent").innerHTML=recent.slice(0,5).map(it=>{
    const tg=it.tags?`<div class="rtags">${it.tags.split(",").filter(Boolean).map(t=>"#"+t).join(" ")}</div>`:"";
    return `<div class="ritem"><span class="rtime">${it.criado_em.slice(11,16)}</span>${esc(it.texto.slice(0,90))}${it.texto.length>90?"…":""}${tg}</div>`;
  }).join("");
}

function setStatus(msg,cls){ const s=$("status"); s.textContent=msg||""; s.className="status "+(cls||""); }
function nowLocalISO(){ const d=new Date(),p=(n)=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }

function splash(){ const s=$("splash"); s.classList.add("show"); const b=$("badge"); b.classList.remove("pulse"); void b.offsetWidth; b.classList.add("pulse"); setTimeout(()=>s.classList.remove("show"),700); }

async function sendOne(item){
  const url=localStorage.getItem(LS.url), key=localStorage.getItem(LS.key);
  if(!url||!key) throw new Error("Configure Supabase URL e anon key (⚙️).");
  const r=await fetch(url.replace(/\/$/,"")+"/rest/v1/insights",{
    method:"POST",
    headers:{ "Content-Type":"application/json","apikey":key,"Authorization":"Bearer "+key,"Prefer":"return=minimal" },
    body:JSON.stringify(item)
  });
  if(!r.ok){ const t=await r.text(); throw new Error("HTTP "+r.status+" "+t.slice(0,120)); }
}
async function flushQueue(){
  let q=getQueue(); if(!q.length)return;
  const rest=[];
  for(const it of q){ try{ await sendOne(it); }catch(e){ rest.push(it); } }
  setQueue(rest);
  if(!rest.length) setStatus("Fila offline enviada. ✅","ok");
}

function resetForm(){ txt.value=""; autogrow(); countWords(); activeTags.clear(); document.querySelectorAll(".tag.on").forEach(t=>t.classList.remove("on")); }

$("save").addEventListener("click",async()=>{
  const texto=txt.value.trim();
  if(!texto){ setStatus("Escreve algo primeiro.","warn"); txt.focus(); return; }
  const item={ texto, tags:[...activeTags].join(","), secret:localStorage.getItem(LS.secret)||"", origem:"webapp", criado_em:nowLocalISO(), puxado:false };
  const btn=$("save"); btn.disabled=true; $("savelbl").innerHTML='<span class="spinner"></span> Salvando…'; setStatus("");
  try{
    if(!navigator.onLine) throw new Error("offline");
    await sendOne(item);
    buzz(28); splash(); bumpDay(); addRecent(item);
    setStatus("Salvo no cérebro. 🧠✅","ok"); resetForm();
  }catch(e){
    const q=getQueue(); q.push(item); setQueue(q); addRecent(item);
    setStatus(navigator.onLine ? ("Falhou, guardei offline: "+e.message) : "Offline — guardado, envio quando voltar.","warn");
    resetForm();
  }finally{ btn.disabled=false; $("savelbl").textContent="Salvar no cérebro"; }
});

renderDay(false); autogrow(); countWords(); renderQueue(); flushQueue();

// --- Abas: Capturar / Análises ---
function showTab(which){
  const cap = which === "cap";
  $("capV").hidden = !cap; $("anV").hidden = cap;
  $("tabCap").classList.toggle("on", cap);
  $("tabAn").classList.toggle("on", !cap);
  if(!cap) loadAnalises();
}
$("tabCap").addEventListener("click",()=>showTab("cap"));
$("tabAn").addEventListener("click",()=>showTab("an"));

// --- Mini markdown → HTML (subset: títulos, tabelas, negrito, citação, lista) ---
function mdInline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>"); }
// tabela de ranking → lista de cartões: nome + métrica-destaque (última coluna) + barra + etiquetas
function renderCards(head, body){
  const hi = head.length - 1;                 // coluna-destaque (ex: CPLQ, Variação, CPL)
  const numOf = (s)=>{ const m=(s||"").replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",",".").match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):null; };
  const max = Math.max(0, ...body.map(r=>Math.abs(numOf(r[hi])||0)));
  let out='<div class="cards">';
  for(const r of body){
    const name=r[0]||"", hv=r[hi]||"";
    const cls=/🟢/.test(hv)?"pos":(/🔴/.test(hv)?"neg":"");
    const n=numOf(hv); const w=(max>0&&n!=null)?Math.max(4,Math.round(100*Math.abs(n)/max)):0;
    let chips="";
    for(let c=1;c<hi;c++){ let v=(r[c]||"").trim(); if(!v||v==="—")continue; if(v.length>26)v=v.slice(0,25)+"…";
      chips+='<span class="chip"><span class="chip-l">'+mdInline(head[c])+'</span> '+mdInline(v)+'</span>'; }
    out+='<div class="card"><div class="card-top"><span class="card-name">'+mdInline(name)+'</span><span class="card-h '+cls+'">'+mdInline(hv)+'</span></div>';
    if(w>0) out+='<div class="bar"><i class="'+cls+'" style="width:'+w+'%"></i></div>';
    if(chips) out+='<div class="chips">'+chips+'</div>';
    out+="</div>";
  }
  return out+"</div>";
}
function mdToHtml(md){
  const L=(md||"").replace(/\r/g,"").split("\n"); let html=""; let i=0;
  const cells=(r)=>r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
  while(i<L.length){
    const line=L[i];
    if(/^\s*\|/.test(line)){
      const rows=[]; while(i<L.length && /^\s*\|/.test(L[i])){ rows.push(L[i]); i++; }
      const head=cells(rows[0]);
      // resumo (2 colunas) → cartões de KPI
      if(head.length===2){
        let t='<div class="kpis">';
        for(let r=2;r<rows.length;r++){ const c=cells(rows[r]); const v=c[1]||"";
          const cls=/🟢/.test(v)?"pos":(/🔴/.test(v)?"neg":"");
          t+='<div class="kpi"><div class="kpi-l">'+mdInline(c[0])+'</div><div class="kpi-v '+cls+'">'+mdInline(v)+'</div></div>'; }
        html+=t+"</div>"; continue;
      }
      // ranking (3+ colunas) → cartões (limpo, sem rolagem lateral)
      html+=renderCards(head, rows.slice(2).map(cells)); continue;
    }
    if(/^###\s/.test(line)){ html+="<h3>"+mdInline(line.replace(/^###\s/,""))+"</h3>"; i++; continue; }
    if(/^##\s/.test(line)){ html+="<h3>"+mdInline(line.replace(/^##\s/,""))+"</h3>"; i++; continue; }
    if(/^#\s/.test(line)){ html+='<h1 class="md">'+mdInline(line.replace(/^#\s/,""))+"</h1>"; i++; continue; }
    if(/^>\s?/.test(line)){ const b=[]; while(i<L.length && /^>\s?/.test(L[i])){ b.push(L[i].replace(/^>\s?/,"")); i++; } html+="<blockquote>"+mdInline(b.join(" "))+"</blockquote>"; continue; }
    if(/^[-*]\s/.test(line)){ const it=[]; while(i<L.length && /^[-*]\s/.test(L[i])){ it.push(L[i].replace(/^[-*]\s/,"")); i++; } html+="<ul>"+it.map(x=>"<li>"+mdInline(x)+"</li>").join("")+"</ul>"; continue; }
    if(line.trim()===""){ i++; continue; }
    html+="<p>"+mdInline(line)+"</p>"; i++;
  }
  return html;
}

// quebra a análise em seções (## ) → vira mini-abas
function shortName(n){ return n.split(/[(—]/)[0].trim(); }
function parseSections(md){
  const lines=(md||"").replace(/\r/g,"").split("\n");
  let title="", intro=[], secs=[], cur=null;
  for(const ln of lines){
    if(!title && /^#\s/.test(ln)){ title=ln.replace(/^#\s/,""); continue; }
    if(/^##\s/.test(ln)){ cur={ name:ln.replace(/^##\s+/,""), body:[] }; secs.push(cur); continue; }
    if(cur) cur.body.push(ln); else intro.push(ln);
  }
  return { title, intro:intro.join("\n").trim(), secs };
}
function renderAnalise(a){
  const d=new Date(a.gerado_em); const dd=isNaN(d.getTime())?"":("gerado "+d.toLocaleString("pt-BR"));
  const { title, intro, secs }=parseSections(a.conteudo_md);
  let h='<div class="an"><div class="an-date">'+dd+"</div>";
  if(title) h+='<h1 class="md">'+mdInline(title)+"</h1>";
  if(intro) h+=mdToHtml(intro);
  if(secs.length){
    h+='<div class="subtabs">'+secs.map((s,i)=>'<button class="subtab'+(i===0?" on":"")+'" data-i="'+i+'">'+esc(shortName(s.name))+"</button>").join("")+"</div>";
    h+='<div class="subpanels">'+secs.map((s,i)=>'<div class="subpanel" data-i="'+i+'"'+(i===0?"":" hidden")+">"+mdToHtml(s.body.join("\n"))+"</div>").join("")+"</div>";
  } else { h+=mdToHtml(a.conteudo_md); }
  return h+"</div>";
}
// troca de mini-aba (delegado, uma vez só)
$("anList").addEventListener("click",(e)=>{
  const b=e.target.closest(".subtab"); if(!b) return;
  const card=b.closest(".an"), i=b.dataset.i;
  card.querySelectorAll(".subtab").forEach(x=>x.classList.toggle("on", x.dataset.i===i));
  card.querySelectorAll(".subpanel").forEach(x=>{ x.hidden = x.dataset.i!==i; });
});

let anLoaded=false;
async function loadAnalises(force){
  if(anLoaded && !force) return;
  const url=localStorage.getItem(LS.url), key=localStorage.getItem(LS.key);
  const box=$("anList"); box.innerHTML='<div class="an-loading">Carregando análises…</div>';
  try{
    const r=await fetch(url.replace(/\/$/,"")+"/rest/v1/analises?select=titulo,conteudo_md,gerado_em&order=gerado_em.desc&limit=20",
      { headers:{ apikey:key, Authorization:"Bearer "+key } });
    if(!r.ok) throw new Error("HTTP "+r.status);
    const data=await r.json(); anLoaded=true;
    if(!data.length){ box.innerHTML='<div class="an-empty">Nenhuma análise ainda. 📭<br>A primeira sai na segunda (ou dá pra rodar na mão no GitHub Actions).</div>'; return; }
    box.innerHTML=data.map(renderAnalise).join("");
  }catch(e){ anLoaded=false; box.innerHTML='<div class="an-empty">Erro ao carregar: '+esc(e.message)+"</div>"; }
}
</script>

<script>
/* Fundo topográfico WebGL — shader (grade 48px + linhas de contorno via simplex noise)
   portado do componente TopoField (MengTo/threeui, MIT) para HTML puro, tingido de esmeralda. */
(function(){
  const canvas=document.getElementById('bg');
  const gl=canvas&&canvas.getContext('webgl',{alpha:false,antialias:false,depth:false});
  if(!gl){ document.body.style.background='#05070a'; return; }
  const vs="attribute vec2 a_position; void main(){ gl_Position=vec4(a_position,0.0,1.0); }";
  const fs=`precision highp float;
    uniform vec2 u_resolution; uniform float u_time; uniform float u_dpr;
    vec3 permute(vec3 x){ return mod(((x*34.0)+1.0)*x,289.0); }
    float snoise(vec2 v){
      const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);
      vec2 i=floor(v+dot(v,C.yy)); vec2 x0=v-i+dot(i,C.xx);
      vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);
      vec4 x12=x0.xyxy+C.xxzz; x12.xy-=i1; i=mod(i,289.0);
      vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));
      vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0); m=m*m; m=m*m;
      vec3 x=2.0*fract(p*C.www)-1.0; vec3 h=abs(x)-0.5; vec3 ox=floor(x+0.5);
      vec3 a0=x-ox; m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);
      vec3 g; g.x=a0.x*x0.x+h.x*x0.y; g.yz=a0.yz*x12.xz+h.yz*x12.yw; return 130.0*dot(m,g);
    }
    void main(){
      vec2 st=gl_FragCoord.xy/u_resolution.xy; st.x*=u_resolution.x/u_resolution.y;
      float gridSize=48.0*u_dpr; vec2 gf=fract(gl_FragCoord.xy/gridSize);
      float lt=1.0/gridSize; float grid=clamp(step(1.0-lt,gf.x)+step(1.0-lt,gf.y),0.0,1.0)*0.09;
      vec2 np=st*1.4+vec2(u_time*0.015,u_time*0.025);
      float n=snoise(np)*0.5+0.5; float tw=abs(fract(n*10.0)-0.5)*2.0;
      float topo=smoothstep(0.02,0.0,tw)*0.5;
      vec3 color=vec3(1.0)*grid + vec3(0.204,0.831,0.6)*topo;
      gl_FragColor=vec4(color,1.0);
    }`;
  function sh(t,s){ const o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) console.warn(gl.getShaderInfoLog(o)); return o; }
  const pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr); gl.useProgram(pr);
  const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'a_position'); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const uR=gl.getUniformLocation(pr,'u_resolution'), uT=gl.getUniformLocation(pr,'u_time'), uD=gl.getUniformLocation(pr,'u_dpr');
  function resize(){ const dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr;
    gl.viewport(0,0,canvas.width,canvas.height); gl.uniform2f(uR,canvas.width,canvas.height); gl.uniform1f(uD,dpr); }
  addEventListener('resize',resize); resize();
  const t0=performance.now();
  (function loop(t){ gl.uniform1f(uT,(t-t0)*0.001); gl.drawArrays(gl.TRIANGLE_STRIP,0,4); requestAnimationFrame(loop); })(t0);
})();
</script>
